<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Préstamos</title>

    <!-- Antes era un formulario con estilos.css; ahora es una tabla con Bootstrap,
         igual que actividades.html. La usan los dos roles: el admin ve todos los prestamos
         y puede crear; el asociado solo ve los suyos (lo decide controladores/prestamos.js). -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Colores del club; va despues de Bootstrap para poder cambiar sus estilos -->
    <link rel="stylesheet" href="../assets/css/panel.css">
</head>

<body>
    <div class="encabezado-club d-flex justify-content-between align-items-center p-3 shadow-sm">
        <h3 class="mb-0">CLUB ACERIAS - Préstamos</h3>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
    </div>

    <main class="container py-4">
        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3"
        >
            <p id="textoAyuda" class="mb-0 text-muted">
                Consulta el estado de tus préstamos. La tasa de interés es fija del 1% mensual.
            </p>
            <!-- Solo lo ve el administrador -->
            <button
                id="botonNuevoPrestamo"
                class="btn btn-club d-none"
                type="button"
            >
                <i class="bi bi-plus-lg"></i>
                Nuevo préstamo
            </button>
        </div>

        <div class="card tarjeta-club shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">#</th>
                            <!-- Solo lo ve el administrador -->
                            <th id="encabezadoAsociado" class="d-none" scope="col">Asociado</th>
                            <th scope="col">Valor</th>
                            <th scope="col">Tasa</th>
                            <th scope="col">Cuotas</th>
                            <th scope="col">Valor cuota</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Próximo pago</th>
                            <th scope="col">Pagado</th>
                            <th scope="col">Saldo</th>
                            <th scope="col">Estado</th>
                            <!-- Editar y eliminar, solo lo ve el administrador (igual que en actividades.html) -->
                            <th id="encabezadoAcciones" class="d-none" scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaPrestamos">
                        <tr>
                            <td colspan="12" class="text-center py-4">
                                Cargando préstamos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de formulario: crear o editar un prestamo (solo administradores) -->
    <div class="modal fade" id="modalFormulario" tabindex="-1" aria-labelledby="tituloFormulario" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="formularioPrestamo" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="tituloFormulario">Nuevo préstamo</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <!-- Vacio al crear; al editar guarda el id del prestamo (igual que idActividad) -->
                    <input type="hidden" id="idPrestamo">
                    <div class="mb-3">
                        <label for="documento" class="form-label">Documento del asociado</label>
                        <input type="number" class="form-control" id="documento" min="1" required placeholder="1000100002">
                    </div>
                    <div class="mb-3">
                        <label for="valorPrestamo" class="form-label">Valor del préstamo (COP)</label>
                        <input type="number" class="form-control" id="valorPrestamo" min="1" step="0.01" required placeholder="1000000">
                    </div>
                    <div class="mb-3">
                        <label for="numeroCuotas" class="form-label">Número de cuotas (meses)</label>
                        <input type="number" class="form-control" id="numeroCuotas" min="1" max="60" step="1" required placeholder="12">
                    </div>
                    <div class="mb-3">
                        <label for="fechaPrestamo" class="form-label">Fecha del préstamo</label>
                        <input type="date" class="form-control" id="fechaPrestamo" required>
                    </div>
                    <div class="mb-3">
                        <!-- La tasa no se envia: el servidor siempre guarda 1% (prestamos.php) -->
                        <label for="tasaInteres" class="form-label">Tasa de interés mensual</label>
                        <input type="text" class="form-control bg-body-secondary" id="tasaInteres" value="1%" readonly>
                    </div>
                    <!-- Se llena con prestamos.js mientras se escriben el valor y las cuotas -->
                    <p id="resumenCuota" class="mb-0 text-muted small"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-club" id="botonGuardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container py-4 text-center text-secondary small">Club Acerías · Sistema de gestión</div>
    </footer>

    <!-- JS de Bootstrap: necesario para abrir y cerrar el modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controladores/prestamos.js"></script>
</body>

</html>
