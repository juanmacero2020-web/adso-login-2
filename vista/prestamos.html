<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Registro de préstamo</title>
    <link rel="stylesheet" href="../assets/css/estilos.css">
    <script src="../controladores/sesion.js"></script>
</head>

<body>
    <div>
        <h2>Registro de préstamo</h2>

        <form data-clave="prestamos">
            <div class="grupo-input">
                <label for="documento">Ingresar el Documento del asociado</label>
                <input type="number" id="documento" name="documento" required placeholder="1938392928">
            </div>

            <div class="grupo-input">
                <label for="monto">Ingresar el Monto</label>
                <input type="number" id="monto" name="monto" min="1" required placeholder="1000000">
            </div>

            <div class="grupo-input">
                <label for="plazo">Ingresar el Plazo en meses</label>
                <input type="number" id="plazo" name="plazo" min="1" required placeholder="12">
            </div>

            <div class="grupo-input">
                <label for="tasa">Ingresar la Tasa mensual (%)</label>
                <input type="number" id="tasa" name="tasa" min="0" step="0.1" required placeholder="1.5">
            </div>

            <div class="grupo-input">
                <label for="fecha">Ingresar la Fecha de desembolso</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="grupo-input">
                <label for="destino">Ingresar el Destino</label>
                <input type="text" id="destino" name="destino" required placeholder="mejoras de vivienda">
            </div>

            <div class="grupo-botones">
                <button type="submit">guardar</button>
                <button type="reset">limpiar formulario</button>
            </div>

            <p class="volver"><a href="dashboard.html">Volver al panel</a></p>
        </form>
    </div>

    <script src="../controladores/formulario.js"></script>
</body>

</html>
