<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Actividades</title>
    
    <!-- Bootstrap e iconos (los mismos del dashboard) para que la tabla tenga estilos.
         No se carga estilos.css porque limita el body a 450px y aplastaria la tabla. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Colores del club; va despues de Bootstrap para poder cambiar sus estilos -->
    <link rel="stylesheet" href="../assets/css/panel.css">
</head>

<body>
    <!-- Encabezado con regreso al panel (antes estaba el enlace "Volver al panel" en el formulario) -->
    <div class="encabezado-club d-flex justify-content-between align-items-center p-3 shadow-sm">
        <h3 class="mb-0">CLUB ACERIAS - Actividades</h3>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
    </div>

    <main class="container py-4">
        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3"
        >
            <p class="mb-0 text-muted">
                Consulta las actividades programadas y su información.
            </p>
            <button
                id="nuevaActividad"
                class="btn btn-club d-none"
                type="button"
            >
                <i class="bi bi-plus-lg"></i>
                Nueva actividad
            </button>
        </div>

        <div class="card tarjeta-club shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudado</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="5" class="text-center py-4">
                                Cargando actividades...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Mensaje cuando no hay actividades (lo muestra controladores/actividades.js) -->
            <div id="sinActividades" class="text-center py-5 text-secondary d-none">
                <i class="bi bi-calendar-x fs-1"></i>
                <p class="mt-2 mb-0">No hay actividades registradas.</p>
            </div>
        </div>
    </main>

    <!-- Modal de detalle: ventana emergente con la informacion de una actividad -->
    <div class="modal fade" id="modalActividad" tabindex="-1" aria-labelledby="tituloModalActividad" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="tituloModalActividad"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p id="descripcionModal" class="text-secondary"></p>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item px-0"><i class="bi bi-calendar3 me-2 text-primary"></i><span id="fechaModal"></span></li>
                        <li class="list-group-item px-0"><i class="bi bi-clock me-2 text-primary"></i><span id="horaModal"></span></li>
                        <li class="list-group-item px-0"><i class="bi bi-geo-alt me-2 text-primary"></i><span id="lugarModal"></span></li>
                        <li class="list-group-item px-0"><i class="bi bi-person me-2 text-primary"></i><span id="responsableModal"></span></li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container py-4 text-center text-secondary small">Club Acerías · Sistema de gestión</div>
    </footer>

    <!-- JS de Bootstrap: necesario para abrir y cerrar el modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controladores/actividades.js"></script>
</body>

</html>
