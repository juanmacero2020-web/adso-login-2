<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Registro de pago</title>
    <link rel="stylesheet" href="../assets/css/estilos.css">
    <script src="../controladores/sesion.js"></script>
</head>

<body>
    <div>
        <h2>Registro de pago</h2>

        <form data-clave="pagos">
            <div class="grupo-input">
                <label for="documento">Ingresar el Documento del asociado</label>
                <input type="number" id="documento" name="documento" required placeholder="1938392928">
            </div>

            <div class="grupo-input">
                <label for="concepto">Ingresar el Concepto</label>
                <select id="concepto" name="concepto">
                    <option>Cuota mensual</option>
                    <option>Adelanto de cuotas</option>
                    <option>Multa</option>
                </select>
            </div>

            <div class="grupo-input">
                <label for="valor">Ingresar el Valor</label>
                <input type="number" id="valor" name="valor" min="1" required placeholder="50000">
            </div>

            <div class="grupo-input">
                <label for="fecha">Ingresar la Fecha de pago</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="grupo-input">
                <label for="metodo">Ingresar el Metodo de pago</label>
                <select id="metodo" name="metodo">
                    <option>Efectivo</option>
                    <option>Transferencia</option>
                    <option>PSE</option>
                </select>
            </div>

            <div class="grupo-botones">
                <button type="submit">guardar</button>
                <button type="reset">limpiar formulario</button>
            </div>

            <p class="volver"><a href="dashboard.html">Volver al panel</a></p>
        </form>
    </div>

    <script src="../controladores/formulario.js"></script>
</body>

</html>
