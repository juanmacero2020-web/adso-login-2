<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Mis pagos</title>

    <!-- Nuevo: antes era un formulario suelto con estilos.css; ahora el asociado elige un prestamo
         de la tabla y le abona. Usa Bootstrap y panel.css igual que actividades.html. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Colores del club; va despues de Bootstrap para poder cambiar sus estilos -->
    <link rel="stylesheet" href="../assets/css/panel.css">
</head>

<body>
    <div class="encabezado-club d-flex justify-content-between align-items-center p-3 shadow-sm">
        <h3 class="mb-0">CLUB ACERIAS - Mis pagos</h3>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
    </div>

    <main class="container py-4">
        <!-- 1. Prestamos del asociado: el boton "Seleccionar" llena el formulario de abajo -->
        <p class="text-muted">
            Selecciona el préstamo al que quieres abonar.
        </p>
        <div class="card tarjeta-club shadow-sm mb-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Valor</th>
                            <th scope="col">Cuotas</th>
                            <th scope="col">Valor cuota</th>
                            <th scope="col">Próximo pago</th>
                            <th scope="col">Saldo</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="listaPrestamos">
                        <tr>
                            <td colspan="8" class="text-center py-4">
                                Cargando préstamos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. Formulario del abono: los campos grises (bg-body-secondary) los llena pagos.js y no se pueden cambiar -->
        <div class="card tarjeta-club shadow-sm mb-4">
            <form class="card-body" id="formularioPago" novalidate>
                <h2 class="fs-5 mb-3">Registrar abono</h2>
                <input type="hidden" id="idPrestamo">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="documento" class="form-label">Número de identidad</label>
                        <input type="text" class="form-control bg-body-secondary" id="documento" readonly>
                    </div>
                    <div class="col-md-3">
                        <label for="prestamoSeleccionado" class="form-label">Préstamo</label>
                        <input type="text" class="form-control bg-body-secondary" id="prestamoSeleccionado" readonly placeholder="Selecciona en la tabla">
                    </div>
                    <div class="col-md-3">
                        <label for="saldoPendiente" class="form-label">Saldo pendiente</label>
                        <input type="text" class="form-control bg-body-secondary" id="saldoPendiente" readonly>
                    </div>
                    <div class="col-md-3">
                        <label for="valorCuotaPrestamo" class="form-label">Valor de la cuota</label>
                        <input type="text" class="form-control bg-body-secondary" id="valorCuotaPrestamo" readonly>
                    </div>
                    <div class="col-md-4">
                        <label for="valorAbono" class="form-label">Valor a abonar (COP)</label>
                        <input type="number" class="form-control" id="valorAbono" min="1" step="0.01" required placeholder="50000">
                    </div>
                    <div class="col-md-4">
                        <label for="fechaPago" class="form-label">Fecha de pago</label>
                        <input type="date" class="form-control" id="fechaPago" required>
                    </div>
                    <div class="col-md-4">
                        <label for="metodoPago" class="form-label">Método de pago</label>
                        <select class="form-select" id="metodoPago" required>
                            <option>Efectivo</option>
                            <option>Transferencia</option>
                            <option>PSE</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button type="button" class="btn btn-outline-secondary" id="botonLimpiar">Limpiar formulario</button>
                    <button type="submit" class="btn btn-club" id="botonGuardar" disabled>Guardar abono</button>
                </div>
            </form>
        </div>

        <!-- 3. Historial de abonos del asociado -->
        <h2 class="fs-5">Historial de pagos</h2>
        <div class="card tarjeta-club shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Fecha</th>
                            <th scope="col">Préstamo</th>
                            <th scope="col">Valor</th>
                            <th scope="col">Método</th>
                        </tr>
                    </thead>
                    <tbody id="listaPagos">
                        <tr>
                            <td colspan="4" class="text-center py-4">
                                Cargando pagos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <div class="container py-4 text-center text-secondary small">Club Acerías · Sistema de gestión</div>
    </footer>

    <script src="../controladores/pagos.js"></script>
</body>

</html>
